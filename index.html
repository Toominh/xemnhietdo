<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nhiệt độ phần cứng</title>
<style>
  :root{--bg:#0d1016;--card:#161b24;--line:#252c3a;--text:#eef1f7;--muted:#7d8799;--ok:#3ecf8e;--warn:#f5b84b;--hot:#ff5d5d}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Segoe UI",sans-serif;padding:20px}
  #grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;max-width:1000px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;border-left:4px solid var(--c,var(--ok));transition:border-color .4s}
  .top{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
  .name{margin:6px 0 10px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t{font-size:46px;font-weight:700;line-height:1;color:var(--c,var(--ok));font-variant-numeric:tabular-nums;transition:color .4s}
  .t small{font-size:18px;font-weight:500;color:var(--muted);margin-left:2px}
  .sub{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
  .sub b{font-size:20px;font-variant-numeric:tabular-nums;font-weight:600}
  #batt{max-width:1000px;margin:14px auto 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:none}
  #batt h2{margin:0 0 4px;font-size:13px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:8px}
  #bl{display:flex;align-items:baseline;gap:6px;margin:6px 0 8px}
  #bl span{font-size:38px;font-weight:700;font-variant-numeric:tabular-nums}
  #bl small{color:var(--muted);font-size:16px}
  .lvl{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin-bottom:14px}
  .lvl i{display:block;height:100%;width:0;background:var(--ok);transition:width .5s,background .5s}
  #bi{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 24px;font-size:13px}
  #bi div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
  #bi span:first-child{color:var(--muted)}
  #bi span:last-child{font-variant-numeric:tabular-nums}
  #info{max-width:1000px;margin:60px auto;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}
  #info code{background:var(--card);padding:2px 6px;border-radius:5px;color:var(--text)}
  #bar{position:fixed;right:14px;bottom:14px;display:flex;align-items:center;gap:8px}
  #dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
  #dot.on{background:var(--ok)} #dot.err{background:var(--hot)}
  #gear{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;padding:2px}
  #cfg{position:fixed;right:14px;bottom:44px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;display:none;gap:6px}
  #cfg input{width:240px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;font-size:13px}
  #cfg button{background:var(--ok);color:#06210f;border:0;border-radius:6px;padding:6px 10px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<main id="grid"></main>
<section id="batt">
  <h2>🔋 Thông tin pin</h2>
  <div id="bl"><span>--</span><small>%</small></div>
  <div class="lvl"><i id="lv"></i></div>
  <div id="bi"></div>
</section>
<div id="info" style="display:none"></div>
<div id="cfg"><input id="url" spellcheck="false"><button id="save">OK</button></div>
<div id="bar"><span id="dot"></span><button id="gear" title="Cài đặt địa chỉ">⚙</button></div>

<script>
const DEFAULT_URL = 'http://localhost:8085/data.json';
const CATS = {
  cpu:{icon:'🧠', label:'CPU', pref:[/package|tctl|tdie/i, /core max/i]},
  gpu:{icon:'🎮', label:'GPU', pref:[/gpu core/i, /core/i]},
  ram:{icon:'💾', label:'RAM', pref:[/./]},
  ssd:{icon:'💽', label:'SSD', pref:[/^temperature$|composite|temperature 1/i]},
  battery:{icon:'🔋', label:'Pin', pref:[/./]},
};
const ORDER = ['cpu','gpu','ram','ssd','battery'];
const BATT_LABELS = [
  [/charge level/i,'Mức pin'], [/degradation/i,'Độ chai pin'],
  [/designed capacity/i,'Dung lượng thiết kế'], [/full charged capacity/i,'Dung lượng đầy hiện tại'],
  [/remaining capacity/i,'Dung lượng còn lại'], [/remaining time/i,'Thời gian còn lại'],
  [/rate/i,'Công suất sạc/xả'], [/voltage/i,'Điện áp'], [/current/i,'Dòng điện'],
];
const $ = id => document.getElementById(id);

const qs = new URLSearchParams(location.search).get('url');
let url = qs || (()=>{try{return localStorage.getItem('lhm_url')}catch(e){}})() || DEFAULT_URL;
$('url').value = url;

const num = v => { const m = String(v).replace(',', '.').match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : NaN; };
const color = t => t < 60 ? 'var(--ok)' : t < 80 ? 'var(--warn)' : 'var(--hot)';

function detect(node){
  const s = ((node.ImageURL||'') + ' ' + (node.HardwareId||'')).toLowerCase();
  if(!s.trim()) return null;
  if(/battery/.test(s)) return 'battery';
  if(/gpu|nvidia|radeon|geforce|ati\.|amd_gpu/.test(s) && !/cpu/.test(s)) return 'gpu';
  if(/cpu/.test(s)) return 'cpu';
  if(/nvme|hdd|ssd|storage|disk/.test(s)) return 'ssd';
  if(/ram|memory/.test(s)) return 'ram';
  return null;
}

function parse(root){
  const hws = [];
  (function walk(node, hw, group){
    const kids = node.Children || [];
    if(kids.length){
      const cat = detect(node);
      if(cat){ hw = {cat, name:node.Text, temps:[], all:[]}; hws.push(hw); }
      kids.forEach(k => walk(k, hw, node.Text));
    } else if(hw && node.Value){
      const type = (node.Type || group || '').toLowerCase();
      hw.all.push({name:node.Text, raw:String(node.Value).trim(), value:num(node.Value)});
      if(/temp/.test(type) || /°c|℃/i.test(node.Value)){
        const v = num(node.Value);
        if(!isNaN(v)) hw.temps.push({name:node.Text, value:v});
      }
    }
  })(root, null, '');

  const items = hws.filter(h => h.temps.length).map(h => {
    let main = null;
    for(const p of CATS[h.cat].pref){ main = h.temps.find(t => p.test(t.name)); if(main) break; }
    if(!main) main = h.temps.reduce((a,b) => b.value > a.value ? b : a);
    const it = {cat:h.cat, name:h.name, value:main.value};
    if(h.cat === 'cpu'){
      let avg = h.temps.find(t => /core average|average/i.test(t.name));
      if(avg) it.avg = avg.value;
      else {
        const cores = h.temps.filter(t => /^core #\d+/i.test(t.name) && !/distance/i.test(t.name));
        if(cores.length) it.avg = cores.reduce((s,t) => s + t.value, 0) / cores.length;
      }
    }
    return it;
  }).sort((a,b) => ORDER.indexOf(a.cat) - ORDER.indexOf(b.cat));

  const bh = hws.find(h => h.cat === 'battery');
  let batt = null;
  if(bh){
    const rows = [];
    let level = null;
    bh.all.forEach(s => {
      if(/temperature/i.test(s.name)) return;
      const lab = BATT_LABELS.find(l => l[0].test(s.name));
      if(/charge level/i.test(s.name)) level = s.value;
      rows.push([lab ? lab[1] : s.name, s.raw]);
    });
    batt = {name:bh.name, level, rows};
  }
  return {items, batt};
}

const cards = new Map();
function render(items){
  const grid = $('grid'), keep = new Set();
  items.forEach((it, i) => {
    const key = it.cat + '|' + it.name + '|' + i;
    keep.add(key);
    let c = cards.get(key);
    if(!c){
      const el = document.createElement('section'); el.className = 'card';
      el.innerHTML = `<div class="top"><span>${CATS[it.cat].icon}</span><span>${CATS[it.cat].label}</span></div>
        <div class="name"></div><div class="t"><span></span><small>°C</small></div>
        ${it.cat === 'cpu' ? '<div class="sub"><span>Core trung bình</span><b></b></div>' : ''}`;
      grid.appendChild(el);
      c = {el, v:el.querySelector('.t span'), a:el.querySelector('.sub b'), s:el.querySelector('.sub')};
      el.querySelector('.name').textContent = it.name; el.querySelector('.name').title = it.name;
      cards.set(key, c);
    }
    c.v.textContent = it.value.toFixed(0);
    c.el.style.setProperty('--c', color(it.value));
    if(c.s){
      c.s.style.display = it.avg == null ? 'none' : 'flex';
      if(it.avg != null){ c.a.textContent = it.avg.toFixed(0) + ' °C'; c.a.style.color = color(it.avg); }
    }
    grid.appendChild(c.el);
  });
  for(const [k,c] of cards) if(!keep.has(k)){ c.el.remove(); cards.delete(k); }
}

function renderBatt(b){
  const sec = $('batt');
  if(!b){ sec.style.display = 'none'; return; }
  sec.style.display = 'block';
  if(b.level != null && !isNaN(b.level)){
    $('bl').style.display = 'flex';
    $('bl').firstChild.textContent = b.level.toFixed(0);
    $('lv').parentNode.style.display = 'block';
    $('lv').style.width = Math.min(100, b.level) + '%';
    $('lv').style.background = b.level < 20 ? 'var(--hot)' : b.level < 40 ? 'var(--warn)' : 'var(--ok)';
  } else { $('bl').style.display = 'none'; $('lv').parentNode.style.display = 'none'; }
  $('bi').innerHTML = b.rows.filter(r => !/mức pin/i.test(r[0])).map(r => `<div><span>${r[0]}</span><span>${r[1]}</span></div>`).join('');
}

function info(html){ const i = $('info'); i.style.display = html ? 'block' : 'none'; i.innerHTML = html || ''; }

async function tick(){
  try{
    const res = await fetch(url, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const {items, batt} = parse(await res.json());
    render(items); renderBatt(batt);
    $('dot').className = 'on';
    info(items.length || batt ? '' : 'Không có phần cứng nào có cảm biến nhiệt.');
  }catch(e){
    $('dot').className = 'err';
    if(!cards.size) info(`Không kết nối được tới <code>${url}</code><br>Bật Libre Hardware Monitor (chạy Administrator) → <code>Options</code> → <code>Remote Web Server</code> → <code>Run</code>.`);
  }
}

$('gear').onclick = () => { const c = $('cfg'); c.style.display = c.style.display === 'flex' ? 'none' : 'flex'; };
$('save').onclick = () => { url = $('url').value.trim() || DEFAULT_URL; try{localStorage.setItem('lhm_url', url)}catch(e){} $('cfg').style.display = 'none'; tick(); };

tick(); setInterval(tick, 1000);
</script>
</body>
</html>
